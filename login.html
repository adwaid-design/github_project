<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Tool Platform</title>
    <!-- Tailwind CSS CDN for modern, clean AI-style aesthetics -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Dark mode cyberpunk-ish grid background often used in AI tools */
        body {
            background-color: #0b0f19;
            background-image: 
                linear-gradient(rgba(18, 24, 38, 0.5) 2px, transparent 2px),
                linear-gradient(90deg, rgba(18, 24, 38, 0.5) 2px, transparent 2px);
            background-size: 40px 40px;
        }
        /* Subtle glow animation for the AI brand gradient */
        .glow-effect {
            box-shadow: 0 0 40px -10px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="flex min-h-screen items-center justify-center p-4 antialiased text-slate-200">

    <div class="glow-effect w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/80 p-8 backdrop-blur-md shadow-2xl">
        
        <!-- Header / Brand -->
        <div class="mb-8 text-center">
            <div class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white font-bold text-xl shadow-lg shadow-indigo-500/30">
                ✧
            </div>
            <h1 class="mt-4 text-2xl font-bold tracking-tight text-white">Welcome back</h1>
            <p class="mt-1 text-sm text-slate-400">Log in to your AI workspace</p>
        </div>

        <!-- Social SSO Login Option (Standard for AI Apps) -->
        <button type="button" class="flex w-full items-center justify-center gap-3 rounded-lg border border-slate-700 bg-slate-800 px-4 py-2.5 text-sm font-medium text-slate-200 hover:bg-slate-700 transition duration-200 cursor-pointer">
            <!-- Google Icon SVG -->
            <svg class="h-5 w-5" viewBox="0 0 24 24" width="24" height="24" xmlns="http://w3.org">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>

        <!-- Divider -->
        <div class="my-6 flex items-center justify-between">
            <span class="w-1/5 border-b border-slate-800"></span>
            <span class="text-xs uppercase text-slate-500 tracking-wider">or email</span>
            <span class="w-1/5 border-b border-slate-800"></span>
        </div>

        <!-- Traditional Credentials Form -->
        <form action="/login-endpoint" method="POST" class="space-y-5">
            <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@company.com" 
                    class="mt-1.5 w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200">
            </div>

            <div>
                <div class="flex items-center justify-between">
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Password</label>
                    <a href="/forgot-password" class="text-xs text-indigo-400 hover:text-indigo-300 hover:underline">Forgot?</a>
                </div>
                <input type="password" id="password" name="password" required placeholder="••••••••" 
                    class="mt-1.5 w-full rounded-lg border border-slate-700 bg-slate-900 px-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200">
            </div>

            <div class="flex items-center">
                <input type="checkbox" id="remember" name="remember" 
                    class="h-4 w-4 rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900">
                <label for="remember" class="ml-2 text-sm text-slate-400 select-none">Remember this device</label>
            </div>

            <button type="submit" 
                class="w-full rounded-lg bg-gradient-to-r from-indigo-500 to-purple-600 px-4 py-2.5 text-sm font-semibold text-white shadow-md hover:from-indigo-600 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-900 transition duration-200 cursor-pointer">
                Sign In
            </button>
        </form>

        <!-- Footer / Redirect -->
        <p class="mt-8 text-center text-sm text-slate-400">
            Don't have an account? 
            <a href="/signup" class="font-medium text-indigo-400 hover:text-indigo-300 hover:underline">Create one</a>
        </p>

    </div>

</body>
</html>
