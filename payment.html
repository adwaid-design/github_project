<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment Page</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --text-color: #1f2937;
            --light-bg: #f9fafb;
            --border-color: #d1d5db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            color: var(--text-color);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .payment-container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 24px;
            text-align: center;
            color: #111827;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--light-bg);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            background-color: #ffffff;
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .secure-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            color: #6b7280;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="payment-container">
    <h2>Secure Checkout</h2>
    
    <!-- Replace '#' with your server-side processing script or payment gateway endpoint -->
    <form action="#" method="POST" autocomplete="on">
        
        <!-- Cardholder Name -->
        <div class="form-group">
            <label for="card-name">Name on Card</label>
            <input type="text" id="card-name" name="cardholder_name" placeholder="John Doe" required autocomplete="cc-name">
        </div>

        <!-- Card Number -->
        <div class="form-group">
            <label for="card-number">Card Number</label>
            <input type="text" id="card-number" name="card_number" placeholder="1234 5678 1234 5678" 
                   required inputmode="numeric" pattern="[0-9\s]{13,19}" autocomplete="cc-number">
        </div>

        <!-- Expiry and CVV Row -->
        <div class="form-row form-group">
            <div class="form-group">
                <label for="card-expiry">Expiration Date</label>
                <input type="text" id="card-expiry" name="card_expiry" placeholder="MM/YY" 
                       required pattern="(0[1-9]|1[0-2])\/([0-9]{2})" autocomplete="cc-exp">
            </div>
            
            <div class="form-group">
                <label for="card-cvv">Security Code (CVV)</label>
                <input type="password" id="card-cvv" name="card_cvv" placeholder="123" 
                       required inputmode="numeric" pattern="[0-9]{3,4}" minlength="3" maxlength="4" autocomplete="cc-csc">
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit">Pay Now</button>
    </form>

    <div class="secure-notice">
        🔒 SSL Encrypted & Secure Payment Processing
    </div>
</div>

</body>
</html>
